---
meta:
  environment: node
  toolchain:
    name: npm
    version: "22"
build:
  skip: false
  additionalCommands: npm run build && mkdir -p dist/config && cp src/config/marketplaces.json dist/config/ && cp src/config/rate_limits.json dist/config/
  artifacts:
    "*": /
run:
  persistenceMount: /data
  scriptName: null
  scriptArguments: null
  nodeArguments: null
  command: npm start
  containerPort: "80"
  servicePort: "80"
